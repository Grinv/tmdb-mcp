<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- tmdb-mcp icon — original vector source. Gradient stops are the exact
       3-stop gradient from TMDB's own wordmark SVG
       (themoviedb.org/assets/.../blue_short-*.svg): #90cea1 -> #3cbec9 (56%)
       -> #00b3e5, left to right. Shape is original (a play triangle), not
       TMDB's logo mark — color only, for visual association. Corners are
       rounded via a same-gradient stroke with a round linejoin (the
       Google-Play-style trick), since <path> has no native corner radius.
       See generate-icon.py in this same directory for how this was actually
       rasterized to assets/icon.png (a plain SVG->PNG render loses the
       transparent background in both a Chrome screenshot and macOS Quick
       Look's SVG thumbnailer — both silently composite against opaque
       white regardless of this file's own lack of a background rect). -->
  <defs>
    <linearGradient id="tmdbGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#90cea1"/>
      <stop offset="0.56" stop-color="#3cbec9"/>
      <stop offset="1" stop-color="#00b3e5"/>
    </linearGradient>
  </defs>
  <path d="M 156 110 L 156 402 L 400 256 Z"
        fill="url(#tmdbGradient)" stroke="url(#tmdbGradient)" stroke-width="52"
        stroke-linejoin="round" stroke-linecap="round"/>
</svg>
